<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>English Mastery Program | Join Now</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --messenger-gradient: linear-gradient(135deg, #0084ff 0%, #006aff 25%, #7241c8 50%, #c4419c 75%, #ff6b6b 100%);
            --telegram-blue: #0088cc;
            --telegram-dark: #006699;
            --accent-yellow: #FFD700;
            --accent-orange: #FF8C00;
            --dark-bg: #0a0f1e;
            --glass-white: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: white;
        }
        
        /* Main container - fixed, no scrolling */
        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        
        /* Poster section - top half */
        .poster-section {
            width: 100%;
            height: 50%;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .program-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        
        /* Content section - bottom half */
        .content-section {
            width: 100%;
            height: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: relative;
        }
        
        /* Animated guideline - eye-catching background */
        .guideline-container {
            width: 100%;
            max-width: 650px;
            text-align: center;
            margin-bottom: 30px;
            padding: 22px 20px;
            position: relative;
            border-radius: 20px;
            background: linear-gradient(135deg, #1a1f38 0%, #252a46 100%);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .guideline-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(255, 215, 0, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, #1f2440 0%, #2a2f4e 100%);
        }
        
        .guideline-text {
            font-size: 1.7rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        
        /* Glowing animation with pulse effect */
        @keyframes textGlow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.6),
                             0 0 20px rgba(255, 215, 0, 0.4),
                             0 0 30px rgba(255, 140, 0, 0.2);
            }
            50% {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.9),
                             0 0 30px rgba(255, 215, 0, 0.6),
                             0 0 45px rgba(255, 140, 0, 0.3);
            }
        }
        
        @keyframes pulseBackground {
            0%, 100% {
                background: linear-gradient(135deg, #1a1f38 0%, #252a46 100%);
            }
            50% {
                background: linear-gradient(135deg, #1f2440 0%, #2a2f4e 100%);
            }
        }
        
        .guideline-text {
            animation: textGlow 2.5s ease-in-out infinite;
        }
        
        .guideline-container {
            animation: pulseBackground 4s ease-in-out infinite;
        }
        
        /* Buttons container - centered */
        .buttons-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }
        
        /* Button wrapper with hand guidance */
        .button-wrapper {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Enlarged hand guidance */
        .hand-guidance {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            animation: floatHand 2.8s ease-in-out infinite;
            cursor: pointer;
        }
        
        /* Individual hand styles */
        .telegram-wrapper .hand-guidance {
            background: rgba(0, 136, 204, 0.25);
            border-color: rgba(0, 136, 204, 0.4);
        }
        
        .messenger-wrapper .hand-guidance {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        @keyframes floatHand {
            0%, 100% {
                transform: translateY(-50%) scale(1);
                opacity: 0.95;
            }
            25% {
                transform: translateY(-50%) scale(1.1);
                opacity: 1;
            }
            50% {
                transform: translateY(-50%) scale(1.15);
                opacity: 1;
            }
            75% {
                transform: translateY(-50%) scale(1.05);
                opacity: 1;
            }
        }
        
        .hand-icon {
            font-size: 36px;
            color: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        
        /* Action buttons - clean, no extra text */
        .action-button {
            width: 100%;
            padding: 22px 30px;
            border-radius: 18px;
            border: none;
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
            z-index: 2;
            letter-spacing: 0.5px;
        }
        
        /* Telegram button */
        .telegram-button {
            background: linear-gradient(135deg, var(--telegram-blue), var(--telegram-dark));
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Messenger button - exact pink gradient */
        .messenger-button {
            background: var(--messenger-gradient);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* Glass morphism overlay */
        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            z-index: 1;
        }
        
        /* Button hover effects */
        .action-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }
        
        .action-button:active {
            transform: translateY(-2px);
        }
        
        .button-content {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 2;
            position: relative;
        }
        
        .button-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));
        }
        
        /* Footer */
        .footer {
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            position: absolute;
            bottom: 0;
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 5;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .guideline-text {
                font-size: 1.5rem;
            }
            
            .guideline-container {
                padding: 20px 18px;
                margin-bottom: 25px;
            }
            
            .hand-guidance {
                width: 70px;
                height: 70px;
                right: -25px;
            }
            
            .hand-icon {
                font-size: 32px;
            }
            
            .action-button {
                padding: 20px 25px;
                font-size: 1.2rem;
            }
            
            .button-icon {
                font-size: 2rem;
            }
        }
        
        @media (max-width: 480px) {
            .guideline-text {
                font-size: 1.3rem;
            }
            
            .guideline-container {
                padding: 18px 15px;
                margin-bottom: 20px;
                border-radius: 16px;
            }
            
            .hand-guidance {
                width: 65px;
                height: 65px;
                right: -20px;
            }
            
            .hand-icon {
                font-size: 28px;
            }
            
            .action-button {
                padding: 18px 22px;
                font-size: 1.1rem;
                border-radius: 16px;
            }
            
            .button-icon {
                font-size: 1.8rem;
            }
            
            .buttons-container {
                gap: 20px;
            }
            
            .content-section {
                padding: 0 15px;
            }
        }
        
        @media (max-width: 360px) {
            .guideline-text {
                font-size: 1.2rem;
            }
            
            .guideline-container {
                padding: 16px 12px;
                margin-bottom: 18px;
            }
            
            .hand-guidance {
                width: 60px;
                height: 60px;
                right: -15px;
            }
            
            .hand-icon {
                font-size: 25px;
            }
            
            .action-button {
                padding: 16px 20px;
                font-size: 1rem;
            }
            
            .button-icon {
                font-size: 1.6rem;
            }
        }
        
        /* Height-specific adjustments */
        @media (max-height: 700px) {
            .poster-section {
                height: 45%;
            }
            
            .content-section {
                height: 55%;
            }
            
            .guideline-container {
                margin-bottom: 20px;
                padding: 18px 16px;
            }
            
            .guideline-text {
                font-size: 1.4rem;
            }
            
            .buttons-container {
                gap: 18px;
            }
            
            .action-button {
                padding: 18px 25px;
            }
        }
        
        @media (max-height: 600px) {
            .guideline-text {
                font-size: 1.2rem;
            }
            
            .guideline-container {
                margin-bottom: 15px;
                padding: 15px 14px;
            }
            
            .hand-guidance {
                width: 60px;
                height: 60px;
            }
            
            .action-button {
                padding: 15px 20px;
            }
        }
        
        /* Prevent scrolling */
        body {
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }
        
        /* Fade-in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .guideline-container, .button-wrapper {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }
        
        .guideline-container {
            animation-delay: 0.2s;
        }
        
        .telegram-wrapper {
            animation-delay: 0.4s;
        }
        
        .messenger-wrapper {
            animation-delay: 0.6s;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Poster Section -->
        <section class="poster-section">
            <img src="https://raw.githubusercontent.com/Daravuth995/Landingpage/refs/heads/main/IMG_7065.jpeg" 
                 alt="English Mastery Program" 
                 class="program-poster">
        </section>
        
        <!-- Content Section -->
        <section class="content-section">
            <!-- Animated Guideline -->
            <div class="guideline-container">
                <div class="guideline-text">
                    ឆាត "Yes" ទៅកាន់តេលេក្រាម ខាងក្រោមសម្រាប់ពត៌មានបន្ថែម
                </div>
            </div>
            
            <!-- Buttons Container -->
            <div class="buttons-container">
                <!-- Telegram Button -->
                <div class="button-wrapper telegram-wrapper">
                    <div class="hand-guidance">
                        <i class="fas fa-hand-point-up hand-icon"></i>
                    </div>
                    <a href="https://t.me/alita995" 
                       target="_blank" 
                       class="action-button telegram-button">
                        <div class="button-content">
                            <i class="fab fa-telegram button-icon"></i>
                            <span>Telegram</span>
                        </div>
                    </a>
                </div>
                
                <!-- Messenger Button -->
                <div class="button-wrapper messenger-wrapper">
                    <div class="hand-guidance">
                        <i class="fas fa-hand-point-up hand-icon"></i>
                    </div>
                    <a href="https://m.me/daravuth.yon" 
                       target="_blank" 
                       class="action-button messenger-button">
                        <div class="button-content">
                            <i class="fab fa-facebook-messenger button-icon"></i>
                            <span>Messenger</span>
                        </div>
                    </a>
                </div>
            </div>
        </section>
        
        <!-- Footer -->
        <footer class="footer">
            <p>© 2023 English Mastery Program | Professional English Fluency Training</p>
        </footer>
    </div>

    <script>
        // Lock scrolling completely
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';
        
        // Prevent any form of scrolling
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.action-button')) return;
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // Enhanced button interactions
        document.querySelectorAll('.action-button').forEach(button => {
            // Ripple effect on click
            button.addEventListener('click', function(e) {
                // Create ripple
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size/2;
                const y = e.clientY - rect.top - size/2;
                
                ripple.style.cssText = `
                    position: absolute;
                    border-radius: 50%;
                    background: rgba(255, 255, 255, 0.5);
                    transform: scale(0);
                    animation: ripple-animation 0.7s linear;
                    width: ${size}px;
                    height: ${size}px;
                    top: ${y}px;
                    left: ${x}px;
                    pointer-events: none;
                    z-index: 1;
                `;
                
                this.appendChild(ripple);
                
                // Remove after animation
                setTimeout(() => ripple.remove(), 700);
                
                // Enhance hand animation on click
                const wrapper = this.closest('.button-wrapper');
                const hand = wrapper.querySelector('.hand-guidance');
                
                // Make hand pulse
                hand.style.animation = 'none';
                hand.style.transform = 'translateY(-50%) scale(1.3)';
                
                setTimeout(() => {
                    hand.style.animation = 'floatHand 2.8s ease-in-out infinite';
                    hand.style.transform = 'translateY(-50%) scale(1)';
                }, 500);
            });
            
            // Enhance hover effect
            button.addEventListener('mouseenter', function() {
                const wrapper = this.closest('.button-wrapper');
                const hand = wrapper.querySelector('.hand-guidance');
                
                hand.style.transform = 'translateY(-50%) scale(1.2)';
                hand.style.filter = 'brightness(1.4) drop-shadow(0 0 10px rgba(255,255,255,0.5))';
                hand.style.boxShadow = '0 15px 45px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.3)';
                
                // Add shine effect to button
                this.style.boxShadow = '0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 255, 255, 0.2)';
            });
            
            button.addEventListener('mouseleave', function() {
                const wrapper = this.closest('.button-wrapper');
                const hand = wrapper.querySelector('.hand-guidance');
                
                hand.style.transform = 'translateY(-50%) scale(1)';
                hand.style.filter = 'brightness(1) drop-shadow(0 0 0 rgba(255,255,255,0))';
                hand.style.boxShadow = '0 12px 40px rgba(0, 0, 0, 0.4)';
                
                this.style.boxShadow = '0 12px 35px rgba(0, 0, 0, 0.4)';
            });
        });
        
        // Add CSS for ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple-animation {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        // Handle viewport resize - maintain perfect proportions
        function adjustLayout() {
            const container = document.querySelector('.container');
            const posterSection = document.querySelector('.poster-section');
            const contentSection = document.querySelector('.content-section');
            const windowHeight = window.innerHeight;
            
            // Calculate optimal heights
            const posterHeight = Math.min(Math.max(windowHeight * 0.5, 280), windowHeight * 0.55);
            const contentHeight = windowHeight - posterHeight;
            
            posterSection.style.height = `${posterHeight}px`;
            contentSection.style.height = `${contentHeight}px`;
            
            // Adjust font sizes for very small screens
            const guideline = document.querySelector('.guideline-text');
            if (windowHeight < 600) {
                guideline.style.fontSize = '1.1rem';
            } else if (windowHeight < 700) {
                guideline.style.fontSize = '1.3rem';
            }
        }
        
        // Add resize and orientation change listeners
        window.addEventListener('resize', adjustLayout);
        window.addEventListener('orientationchange', adjustLayout);
        
        // Initial adjustment
        setTimeout(adjustLayout, 100);
        setTimeout(adjustLayout, 500);
        
        // Add page load effect
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
                adjustLayout();
            }, 100);
        });
    </script>
</body>
</html>
