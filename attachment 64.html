<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>English Mastery Program | Join Now</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Import modern Khmer font -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600;700;800&family=Moul&family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --telegram-gradient: linear-gradient(135deg, #0088cc 0%, #006699 100%);
            --telegram-glow: rgba(0, 136, 204, 0.6);
            --accent-gold: #FFD700;
            --accent-orange: #FF8C00;
            --dark-bg: #0a0f1e;
            --darker-bg: #050913;
            --glass-white: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --khmer-primary: 'Kantumruy Pro', sans-serif;
            --khmer-decorative: 'Moul', cursive;
            --khmer-button: 'Battambang', cursive;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--darker-bg) 100%);
            font-family: var(--khmer-primary);
            color: white;
        }
        
        /* Main container - fixed, no scrolling */
        .container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, rgba(10, 30, 80, 0.3) 0%, transparent 70%);
        }
        
        /* Poster section - top half */
        .poster-section {
            width: 100%;
            height: 50%;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .poster-section::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(to top, var(--dark-bg), transparent);
            z-index: 2;
        }
        
        .program-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
            filter: brightness(1.05);
            transition: transform 8s ease-out;
        }
        
        .poster-section:hover .program-poster {
            transform: scale(1.03);
        }
        
        /* Content section - bottom half */
        .content-section {
            width: 100%;
            height: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            position: relative;
        }
        
        /* Modern Khmer text container */
        .khmer-guideline-container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            margin-bottom: 35px;
            padding: 28px 25px;
            position: relative;
            border-radius: 24px;
            background: rgba(15, 22, 45, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid transparent;
            background-clip: padding-box;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 215, 0, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }
        
        .khmer-guideline-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255, 215, 0, 0.1) 0%, 
                rgba(255, 140, 0, 0.05) 50%, 
                rgba(10, 15, 30, 0) 100%);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .khmer-guideline-container:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5),
                        0 0 0 1px rgba(255, 215, 0, 0.3),
                        0 0 30px rgba(255, 215, 0, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        
        .khmer-guideline-container:hover::before {
            opacity: 1;
        }
        
        /* Modern Khmer text with gradient and effects */
        .khmer-guideline-text {
            font-family: var(--khmer-primary);
            font-size: 2.1rem;
            font-weight: 700;
            color: transparent;
            background: linear-gradient(135deg, 
                #FFFFFF 0%, 
                #FFD700 25%, 
                #FFFFFF 50%, 
                #FFD700 75%, 
                #FFFFFF 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            line-height: 1.5;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            padding: 10px;
            animation: gradientFlow 8s ease-in-out infinite, 
                       textFloat 3s ease-in-out infinite;
        }
        
        /* Gradient animation */
        @keyframes gradientFlow {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        
        /* Floating animation */
        @keyframes textFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-3px);
            }
        }
        
        /* Glow pulse effect */
        @keyframes glowPulse {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            }
        }
        
        .khmer-guideline-text {
            animation: gradientFlow 8s ease-in-out infinite, 
                       textFloat 3s ease-in-out infinite,
                       glowPulse 4s ease-in-out infinite;
        }
        
        /* Buttons container - centered */
        .buttons-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }
        
        /* Button wrapper with hand guidance */
        .button-wrapper {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Enlarged hand guidance with modern design */
        .hand-guidance {
            position: absolute;
            width: 85px;
            height: 85px;
            background: linear-gradient(135deg, rgba(0, 136, 204, 0.3), rgba(0, 102, 153, 0.2));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            right: -35px;
            top: 50%;
            transform: translateY(-50%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5),
                        0 0 20px rgba(0, 136, 204, 0.3);
            animation: floatHand 2.8s ease-in-out infinite,
                       handGlow 3s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .hand-guidance:hover {
            transform: translateY(-50%) scale(1.15);
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 136, 204, 0.5);
        }
        
        @keyframes floatHand {
            0%, 100% {
                transform: translateY(-50%) rotate(0deg);
            }
            25% {
                transform: translateY(-50%) rotate(10deg);
            }
            75% {
                transform: translateY(-50%) rotate(-10deg);
            }
        }
        
        @keyframes handGlow {
            0%, 100% {
                box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5),
                            0 0 20px rgba(0, 136, 204, 0.3);
            }
            50% {
                box-shadow: 0 15px 45px rgba(0, 0, 0, 0.5),
                            0 0 30px rgba(0, 136, 204, 0.6);
            }
        }
        
        .hand-icon {
            font-size: 38px;
            color: white;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }
        
        .hand-guidance:hover .hand-icon {
            transform: scale(1.2);
        }
        
        /* Action button - modern design */
        .action-button {
            width: 100%;
            padding: 25px 35px;
            border-radius: 20px;
            border: none;
            font-family: var(--khmer-primary);
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            z-index: 2;
            letter-spacing: 0.5px;
        }
        
        /* Telegram button with enhanced gradient */
        .telegram-button {
            background: linear-gradient(135deg, 
                #0088cc 0%, 
                #006699 25%, 
                #0088cc 50%, 
                #006699 75%, 
                #0088cc 100%);
            background-size: 300% 300%;
            border: 2px solid rgba(255, 255, 255, 0.25);
            animation: buttonShine 5s ease-in-out infinite;
        }
        
        @keyframes buttonShine {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        
        /* Glowing overlay effect */
        .action-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(255, 255, 255, 0.2), 
                transparent);
            transition: left 0.7s ease;
            z-index: 1;
        }
        
        .action-button:hover::before {
            left: 100%;
        }
        
        /* Button hover effects */
        .action-button:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.6),
                        0 0 30px var(--telegram-glow);
        }
        
        .action-button:active {
            transform: translateY(-4px) scale(1.01);
        }
        
        .button-content {
            display: flex;
            align-items: center;
            gap: 18px;
            z-index: 2;
            position: relative;
        }
        
        .button-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }
        
        .action-button:hover .button-icon {
            transform: scale(1.2) rotate(5deg);
        }
        
        .button-text {
            font-family: var(--khmer-primary);
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }
        
        .button-main-text {
            font-size: 1.5rem;
        }
        
        .khmer-subtitle {
            font-family: var(--khmer-button);
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1.2px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0.8;
            transform: translateY(0);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        /* Animated underline for Khmer subtitle */
        .khmer-subtitle::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #FFD700, #FF8C00);
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 2px;
        }
        
        /* Hover effects for Khmer subtitle */
        .action-button:hover .khmer-subtitle {
            opacity: 1;
            transform: translateY(-2px);
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5),
                         0 0 20px rgba(255, 140, 0, 0.3);
        }
        
        .action-button:hover .khmer-subtitle::after {
            width: 100%;
        }
        
        /* Dynamic animation for Khmer subtitle on hover */
        @keyframes subtitleGlow {
            0%, 100% {
                text-shadow: 0 0 5px rgba(255, 215, 0, 0.3),
                             0 0 10px rgba(255, 140, 0, 0.2);
            }
            50% {
                text-shadow: 0 0 10px rgba(255, 215, 0, 0.8),
                             0 0 20px rgba(255, 140, 0, 0.5),
                             0 0 30px rgba(255, 140, 0, 0.3);
            }
        }
        
        /* Footer with modern design */
        .footer {
            width: 100%;
            padding: 18px;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            position: absolute;
            bottom: 0;
            background: rgba(5, 9, 19, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 5;
            font-family: var(--khmer-primary);
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .khmer-guideline-text {
                font-size: 1.7rem;
            }
            
            .khmer-guideline-container {
                padding: 24px 20px;
                margin-bottom: 30px;
            }
            
            .hand-guidance {
                width: 75px;
                height: 75px;
                right: -30px;
            }
            
            .hand-icon {
                font-size: 34px;
            }
            
            .action-button {
                padding: 22px 30px;
                font-size: 1.3rem;
            }
            
            .button-icon {
                font-size: 2.2rem;
            }
            
            .button-main-text {
                font-size: 1.3rem;
            }
            
            .khmer-subtitle {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .khmer-guideline-text {
                font-size: 1.4rem;
                letter-spacing: 0.5px;
            }
            
            .khmer-guideline-container {
                padding: 20px 18px;
                margin-bottom: 25px;
                border-radius: 20px;
            }
            
            .hand-guidance {
                width: 70px;
                height: 70px;
                right: -25px;
            }
            
            .hand-icon {
                font-size: 30px;
            }
            
            .action-button {
                padding: 20px 25px;
                font-size: 1.2rem;
                border-radius: 18px;
            }
            
            .button-icon {
                font-size: 2rem;
            }
            
            .button-main-text {
                font-size: 1.2rem;
            }
            
            .khmer-subtitle {
                font-size: 0.9rem;
            }
            
            .buttons-container {
                gap: 22px;
            }
            
            .content-section {
                padding: 0 18px;
            }
        }
        
        @media (max-width: 360px) {
            .khmer-guideline-text {
                font-size: 1.3rem;
            }
            
            .khmer-guideline-container {
                padding: 18px 15px;
                margin-bottom: 22px;
            }
            
            .hand-guidance {
                width: 65px;
                height: 65px;
                right: -20px;
            }
            
            .hand-icon {
                font-size: 28px;
            }
            
            .action-button {
                padding: 18px 22px;
                font-size: 1.1rem;
            }
            
            .button-icon {
                font-size: 1.8rem;
            }
            
            .button-main-text {
                font-size: 1.1rem;
            }
            
            .khmer-subtitle {
                font-size: 0.85rem;
            }
        }
        
        /* Height-specific adjustments */
        @media (max-height: 700px) {
            .poster-section {
                height: 45%;
            }
            
            .content-section {
                height: 55%;
            }
            
            .khmer-guideline-container {
                margin-bottom: 25px;
                padding: 22px 20px;
            }
            
            .khmer-guideline-text {
                font-size: 1.5rem;
            }
            
            .buttons-container {
                gap: 20px;
            }
            
            .action-button {
                padding: 20px 28px;
            }
        }
        
        @media (max-height: 600px) {
            .khmer-guideline-text {
                font-size: 1.3rem;
            }
            
            .khmer-guideline-container {
                margin-bottom: 20px;
                padding: 20px 18px;
            }
            
            .hand-guidance {
                width: 65px;
                height: 65px;
            }
            
            .action-button {
                padding: 18px 24px;
            }
        }
        
        /* Prevent scrolling */
        body {
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }
        
        /* Fade-in animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .khmer-guideline-container, .button-wrapper {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }
        
        .khmer-guideline-container {
            animation-delay: 0.3s;
        }
        
        .button-wrapper {
            animation-delay: 0.6s;
        }
        
        /* Floating particles background */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            animation: floatParticle 15s infinite linear;
        }
        
        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0);
            }
            100% {
                transform: translateY(-100px) translateX(100px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Animated background particles -->
        <div class="particles" id="particles"></div>
        
        <!-- Poster Section -->
        <section class="poster-section">
            <img src="https://raw.githubusercontent.com/Daravuth995/Landingpage/refs/heads/main/IMG_7065.jpeg" 
                 alt="English Mastery Program" 
                 class="program-poster">
        </section>
        
        <!-- Content Section -->
        <section class="content-section">
            <!-- Modern Khmer Guideline -->
            <div class="khmer-guideline-container">
                <div class="khmer-guideline-text">
                    ឆាត "Yes" ទៅកាន់តេលេក្រាម ខាងក្រោមសម្រាប់ពត៌មានបន្ថែម
                </div>
            </div>
            
            <!-- Buttons Container -->
            <div class="buttons-container">
                <!-- Telegram Button with Khmer Subtitle -->
                <div class="button-wrapper">
                    <div class="hand-guidance">
                        <i class="fas fa-hand-point-up hand-icon"></i>
                    </div>
                    <a href="https://t.me/alita995" 
                       target="_blank" 
                       class="action-button telegram-button">
                        <div class="button-content">
                            <i class="fab fa-telegram button-icon"></i>
                            <div class="button-text">
                                <span class="button-main-text">Telegram</span>
                                <span class="khmer-subtitle">ចុចត្រង់នេះ</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </section>
        
        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 English Mastery Program | Professional English Fluency Training</p>
        </footer>
    </div>

    <script>
        // Lock scrolling completely
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';
        
        // Prevent any form of scrolling
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('.action-button')) return;
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('wheel', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size and position
                const size = Math.random() * 4 + 1;
                const startX = Math.random() * 100;
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${startX}vw`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Enhanced button interactions
        const actionButton = document.querySelector('.action-button');
        const khmerSubtitle = document.querySelector('.khmer-subtitle');
        
        // Ripple effect on click
        actionButton.addEventListener('click', function(e) {
            // Create ripple
            const ripple = document.createElement('span');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = e.clientX - rect.left - size/2;
            const y = e.clientY - rect.top - size/2;
            
            ripple.style.cssText = `
                position: absolute;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.6);
                transform: scale(0);
                animation: ripple-animation 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
                width: ${size}px;
                height: ${size}px;
                top: ${y}px;
                left: ${x}px;
                pointer-events: none;
                z-index: 1;
            `;
            
            this.appendChild(ripple);
            
            // Remove after animation
            setTimeout(() => ripple.remove(), 800);
            
            // Enhance hand animation on click
            const wrapper = this.closest('.button-wrapper');
            const hand = wrapper.querySelector('.hand-guidance');
            
            // Make hand pulse
            hand.style.animation = 'none';
            hand.style.transform = 'translateY(-50%) scale(1.4) rotate(20deg)';
            hand.style.boxShadow = '0 20px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 136, 204, 0.8)';
            
            // Animate Khmer subtitle on click
            khmerSubtitle.style.animation = 'subtitleGlow 0.5s ease-in-out 3';
            khmerSubtitle.style.color = '#FFD700';
            khmerSubtitle.style.textShadow = '0 0 15px rgba(255, 215, 0, 0.8), 0 0 25px rgba(255, 140, 0, 0.5)';
            
            setTimeout(() => {
                hand.style.animation = 'floatHand 2.8s ease-in-out infinite, handGlow 3s ease-in-out infinite';
                hand.style.transform = 'translateY(-50%) scale(1)';
                hand.style.boxShadow = '0 15px 45px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 136, 204, 0.3)';
                
                // Reset subtitle animation after click
                if (!actionButton.matches(':hover')) {
                    khmerSubtitle.style.animation = '';
                    khmerSubtitle.style.color = '';
                    khmerSubtitle.style.textShadow = '';
                }
            }, 600);
        });
        
        // Enhance hover effect
        actionButton.addEventListener('mouseenter', function() {
            const wrapper = this.closest('.button-wrapper');
            const hand = wrapper.querySelector('.hand-guidance');
            
            hand.style.transform = 'translateY(-50%) scale(1.25)';
            hand.style.filter = 'brightness(1.4) drop-shadow(0 0 15px rgba(0,136,204,0.7))';
            hand.style.boxShadow = '0 20px 55px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 136, 204, 0.5)';
            
            // Add shine effect to button
            this.style.boxShadow = '0 30px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(0, 136, 204, 0.6)';
            
            // Animate Khmer subtitle on hover
            khmerSubtitle.style.animation = 'subtitleGlow 1.5s ease-in-out infinite';
            khmerSubtitle.style.color = '#FFD700';
            khmerSubtitle.style.textShadow = '0 0 10px rgba(255, 215, 0, 0.8), 0 0 20px rgba(255, 140, 0, 0.5)';
            khmerSubtitle.style.transform = 'translateY(-2px)';
        });
        
        actionButton.addEventListener('mouseleave', function() {
            const wrapper = this.closest('.button-wrapper');
            const hand = wrapper.querySelector('.hand-guidance');
            
            hand.style.transform = 'translateY(-50%) scale(1)';
            hand.style.filter = 'brightness(1) drop-shadow(0 0 0 rgba(0,136,204,0))';
            hand.style.boxShadow = '0 15px 45px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 136, 204, 0.3)';
            
            this.style.boxShadow = '0 15px 40px rgba(0, 0, 0, 0.4)';
            
            // Reset Khmer subtitle on mouse leave
            khmerSubtitle.style.animation = '';
            khmerSubtitle.style.color = '';
            khmerSubtitle.style.textShadow = '';
            khmerSubtitle.style.transform = 'translateY(0)';
        });
        
        // Add CSS for animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple-animation {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
            
            @keyframes subtitleGlow {
                0%, 100% {
                    text-shadow: 0 0 10px rgba(255, 215, 0, 0.8),
                                 0 0 20px rgba(255, 140, 0, 0.5);
                }
                50% {
                    text-shadow: 0 0 15px rgba(255, 215, 0, 1),
                                 0 0 30px rgba(255, 140, 0, 0.8),
                                 0 0 45px rgba(255, 140, 0, 0.4);
                }
            }
        `;
        document.head.appendChild(style);
        
        // Handle viewport resize
        function adjustLayout() {
            const container = document.querySelector('.container');
            const posterSection = document.querySelector('.poster-section');
            const contentSection = document.querySelector('.content-section');
            const windowHeight = window.innerHeight;
            
            // Calculate optimal heights
            const posterHeight = Math.min(Math.max(windowHeight * 0.5, 280), windowHeight * 0.55);
            const contentHeight = windowHeight - posterHeight;
            
            posterSection.style.height = `${posterHeight}px`;
            contentSection.style.height = `${contentHeight}px`;
            
            // Adjust font sizes for very small screens
            const guideline = document.querySelector('.khmer-guideline-text');
            if (windowHeight < 600) {
                guideline.style.fontSize = '1.2rem';
            } else if (windowHeight < 700) {
                guideline.style.fontSize = '1.4rem';
            } else {
                guideline.style.fontSize = '2.1rem';
            }
            
            // Adjust for width
            if (window.innerWidth < 480) {
                guideline.style.fontSize = '1.4rem';
            }
            if (window.innerWidth < 360) {
                guideline.style.fontSize = '1.3rem';
            }
        }
        
        // Add resize and orientation change listeners
        window.addEventListener('resize', adjustLayout);
        window.addEventListener('orientationchange', adjustLayout);
        
        // Initial setup
        window.addEventListener('load', function() {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
                createParticles();
                adjustLayout();
            }, 100);
        });
        
        // Initial adjustment
        setTimeout(adjustLayout, 100);
        setTimeout(adjustLayout, 500);
    </script>
</body>
</html>
